name: Sync upstream

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'timmo001/herdr-ts-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HERDR_VERIFY_TIMEOUT_MS: "300000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fork/main
          fetch-depth: 0
      - name: Merge upstream main
        id: merge
        run: |
          git fetch https://github.com/dmmulroy/herdr-ts-sdk.git main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit --no-ff FETCH_HEAD -m "Merge upstream main"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.merge.outputs.changed == 'true'
        with:
          node-version: "24.16.0"
      - name: Read package manager version
        if: steps.merge.outputs.changed == 'true'
        id: package-manager
        run: node -e 'console.log("version=" + JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).devEngines.packageManager.version)' >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.merge.outputs.changed == 'true'
        with:
          version: ${{ steps.package-manager.outputs.version }}
          run_install: false
      - name: Verify merged source
        if: steps.merge.outputs.changed == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm run verify
      - name: Publish verified merge
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:fork/main
